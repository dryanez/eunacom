<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 42 743 320" width="100%" height="240px" style="max-width:743px;height:240px;font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  
    <g filter="url(#cardShadow)">
      <rect x="20" y="55" width="215" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="20" y="55" width="215" height="22" rx="6" fill="url(#redGrad)"/>
      <text x="127" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">1. ESTABILIZACIÓN INICIAL</text>
      <text x="30" y="93" fill="#991b1b" font-size="8.5" font-weight="700">• ABC + 2 vías periféricas gruesas (14-16G)</text>
      <text x="30" y="107" fill="#334155" font-size="8">• Cristaloides (SF 0.9%) para PA meta</text>
      <text x="30" y="120" fill="#334155" font-size="8">• Transfusión de GR si Hb &lt; 7 g/dL (o &lt; 8 con cardiopatía)</text>
      <text x="30" y="134" fill="#1e3a8a" font-size="8" font-weight="700">• IBP bolo 80 mg EV + infusión 8 mg/h</text>
    </g>

    <path d="M 235 105 L 265 105" stroke="#64748b" stroke-width="2"/>

    <g filter="url(#cardShadow)">
      <rect x="270" y="55" width="210" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
      <rect x="270" y="55" width="210" height="22" rx="6" fill="url(#amberGrad)"/>
      <text x="375" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">2. SOSPECHA VARICIAL (DHC)</text>
      <text x="280" y="93" fill="#92400e" font-size="8.5" font-weight="700">• Vasoactivos: Terlipresina o Octreótido</text>
      <text x="280" y="107" fill="#334155" font-size="8">• Profilaxis ATB: Ceftriaxona 1g/d x 7d</text>
      <text x="280" y="120" fill="#64748b" font-size="7.5">  (reduce peritonitis bacteriana y muerte)</text>
      <text x="280" y="134" fill="#b45309" font-size="8" font-weight="700">• Ligadura con bandas elásticas en EDA</text>
    </g>

    <path d="M 480 105 L 510 105" stroke="#64748b" stroke-width="2"/>

    <g filter="url(#cardShadow)">
      <rect x="515" y="55" width="205" height="100" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
      <rect x="515" y="55" width="205" height="22" rx="6" fill="url(#greenGrad)"/>
      <text x="617" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">3. ENDOSCOPIA (EDA &lt; 24H)</text>
      <text x="525" y="93" fill="#065f46" font-size="8.5" font-weight="700">Clasificación de Forrest (Úlcera):</text>
      <text x="525" y="107" fill="#334155" font-size="7.5">• Ia/Ib (Sangrado activo) → Terapia dual</text>
      <text x="525" y="119" fill="#334155" font-size="7.5">• IIa (Vaso visible) → Terapia endoscópica</text>
      <text x="525" y="131" fill="#334155" font-size="7.5">• IIb/IIc/III → IBP oral, alta precoz</text>
    </g>

    <!-- Bottom Box -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="170" width="700" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="20" y="170" width="700" height="22" rx="6" fill="#1e3a8a"/>
      <text x="370" y="185" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">REGLAS CLÍNICAS DE ALTO RENDIMIENTO EN HEMORRAGIA DIGESTIVA</text>
      
      <text x="35" y="210" fill="#1e3a8a" font-size="8.5" font-weight="700">HDA vs HDB (Diferencial):</text>
      <text x="35" y="224" fill="#334155" font-size="8">• HDA (sobre ángulo de Treitz): Hematemesis, Melena, BUN/Creatinina &gt; 30</text>
      <text x="35" y="238" fill="#334155" font-size="8">• HDB: Rectorragia, Hematoquecia (si es masiva con inestabilidad pensar en HDA rápida)</text>
      <text x="35" y="252" fill="#64748b" font-size="7.5">• Causa más frecuente HDA: Úlcera péptica (H. pylori y AINEs). Causa más frec HDB: Diverticulosis</text>

      <text x="380" y="210" fill="#047857" font-size="8.5" font-weight="700">Criterios de Erradicación H. pylori:</text>
      <text x="380" y="224" fill="#334155" font-size="8">• Toda úlcera péptica sangrante requiere test y erradicación de H. pylori</text>
      <text x="380" y="238" fill="#334155" font-size="8">• Terapia cuádruple con Bismuto o IBP + Claritromicina + Amoxicilina + Metronidazol x 14d</text>
      <text x="380" y="252" fill="#334155" font-size="8">• Confirmar erradicación con Test de Aire Espirado o Antígeno en Deposiciones a las 4 sem</text>
    </g>
  
</svg>