<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 42 743 320" width="100%" height="240px" style="max-width:743px;height:240px;font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  
    <g filter="url(#cardShadow)">
      <rect x="20" y="55" width="215" height="100" rx="6" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5"/>
      <rect x="20" y="55" width="215" height="22" rx="6" fill="url(#blueGrad)"/>
      <text x="127" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">1. CLASIFICACIÓN POR VCM</text>
      <text x="30" y="93" fill="#1e3a8a" font-size="8.5" font-weight="700">• Microcítica (VCM &lt; 80 fL):</text>
      <text x="35" y="106" fill="#334155" font-size="8">Ferropénica, Talasemia, Enf. Crónica</text>
      <text x="30" y="120" fill="#047857" font-size="8.5" font-weight="700">• Macrocítica (VCM &gt; 100 fL):</text>
      <text x="35" y="133" fill="#334155" font-size="8">Déficit B12 / Folato, Hipotiroidismo, OH</text>
    </g>

    <path d="M 235 105 L 265 105" stroke="#64748b" stroke-width="2"/>

    <g filter="url(#cardShadow)">
      <rect x="270" y="55" width="210" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
      <rect x="270" y="55" width="210" height="22" rx="6" fill="url(#amberGrad)"/>
      <text x="375" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">2. PERFIL DE HIERRO (MICROCÍTICA)</text>
      <text x="280" y="93" fill="#92400e" font-size="8.5" font-weight="700">Anemia Ferropénica (1ª causa):</text>
      <text x="280" y="106" fill="#334155" font-size="8">• Ferritina &lt; 30 ng/mL (marcador clave)</text>
      <text x="280" y="119" fill="#334155" font-size="8">• Saturación Transferrina (IST) &lt; 20%</text>
      <text x="280" y="132" fill="#334155" font-size="8">• TIBC Elevada, RDW / ADE Aumentado</text>
    </g>

    <path d="M 480 105 L 510 105" stroke="#64748b" stroke-width="2"/>

    <g filter="url(#cardShadow)">
      <rect x="515" y="55" width="205" height="100" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
      <rect x="515" y="55" width="205" height="22" rx="6" fill="url(#greenGrad)"/>
      <text x="617" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">3. RETICULOCITOS (IPR)</text>
      <text x="525" y="93" fill="#065f46" font-size="8.5" font-weight="700">• Regenerativa (IPR &gt; 2%):</text>
      <text x="530" y="106" fill="#334155" font-size="8">Hemólisis (LDH alta, Bilirrubina ind)</text>
      <text x="530" y="119" fill="#334155" font-size="8">Hemorragia aguda activa</text>
      <text x="525" y="133" fill="#dc2626" font-size="8.5" font-weight="700">• Arregenerativa (IPR &lt; 2%): Carencial</text>
    </g>

    <!-- Bottom Box -->
    <g filter="url(#cardShadow)">
      <rect x="20" y="170" width="700" height="135" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
      <rect x="20" y="170" width="700" height="22" rx="6" fill="#1e293b"/>
      <text x="370" y="185" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">DIAGNÓSTICO DIFERENCIAL CLAVE EN ANEMIAS</text>
      
      <text x="35" y="210" fill="#1e3a8a" font-size="8.5" font-weight="700">Ferropénica vs Enfermedad Crónica:</text>
      <text x="35" y="224" fill="#334155" font-size="8">• Ferropénica: Ferritina BAJA, TIBC ALTA, RDW ALTO</text>
      <text x="35" y="238" fill="#334155" font-size="8">• Enfermedad Crónica: Ferritina NORMAL/ALTA (reactante de fase aguda), TIBC BAJA</text>
      <text x="35" y="252" fill="#64748b" font-size="7.5">• Talasemia Menor: VCM muy bajo con recuento de glóbulos rojos NORMAL/ALTO (Índice Mentzer &lt; 13)</text>

      <text x="380" y="210" fill="#dc2626" font-size="8.5" font-weight="700">Déficit B12 vs Déficit Ácido Fólico:</text>
      <text x="380" y="224" fill="#334155" font-size="8">• Déficit B12: Cursa con COMPROMISO NEUROLÓGICO (parestesias, ataxia, cordones posteriores)</text>
      <text x="380" y="238" fill="#334155" font-size="8">• Ácido Metilmalónico ELEVADO en déficit B12; Normal en déficit de folatos</text>
      <text x="380" y="252" fill="#334155" font-size="8">• Anemia Perniciosa: Anticuerpos anti-Célula Parietal y anti-Factor Intrínseco (+)</text>
    </g>
  
</svg>