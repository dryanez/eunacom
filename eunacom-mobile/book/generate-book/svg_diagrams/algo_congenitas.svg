<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%" height="auto">
    <rect width="680" height="280" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="680" height="32" fill="#1e3a8a" rx="4"/>
    <rect x="0" y="24" width="680" height="8" fill="#1e3a8a"/>
    <text x="340" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ALGORITMO DIFERENCIAL DE CARDIOPATÍAS CONGÉNITAS NEONATALES</text>
    
    <!-- Subtitle / Context -->
    <text x="340" y="52" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">ALGORITMO CLÍNICO PASO A PASO (FIRST AID STEP 2 CK &bull; MINSAL)</text>

    <!-- Connectors -->
    
        <line x1="230" y1="177.5" x2="244" y2="177.5" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
        <polygon points="250,177.5 244,173.5 244,181.5" fill="#64748b"/>
        <text x="240" y="171.5" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#2563eb" text-anchor="middle">Evaluación</text>
      
        <line x1="430" y1="177.5" x2="444" y2="177.5" stroke="#64748b" stroke-width="1.5" stroke-dasharray="none"/>
        <polygon points="450,177.5 444,173.5 444,181.5" fill="#64748b"/>
        <text x="440" y="171.5" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#2563eb" text-anchor="middle">Rescate</text>
      

    <!-- Steps -->
    
      <g>
        <rect x="50" y="140" width="180" height="75" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
        <text x="140" y="162" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">1. CIANOSIS NEONATAL</text>
        <text x="140" y="182" font-family="Inter, sans-serif" font-size="8" fill="#1e293b" text-anchor="middle">Test Hiperoxia Negativo</text>
        <text x="140" y="196" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Cortocircuito Derecha-Izquierda</text>
      </g>
    
      <g>
        <rect x="250" y="140" width="180" height="75" rx="4" fill="#fffdf5" stroke="#d97706" stroke-width="1.5"/>
