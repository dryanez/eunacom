        <text x="340" y="182" font-family="Inter, sans-serif" font-size="8" fill="#1e293b" text-anchor="middle">TGA / Tetralogía de Fallot</text>
        <text x="340" y="196" font-family="Inter, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Cierre de Ductus provoca colapso</text>
