<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="607px" preserveAspectRatio="none" style="width:100%;max-width:1066px;height:auto;background:#FFFFFF;" version="1.1" viewBox="0 0 1066 607" width="100%" zoomAndPan="magnify"><defs/><g><g class="title" data-source-line="32"><text fill="#1E3A8A" font-family="Inter, sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="606.4297" x="229.0181" y="32.9951">3. ALGORITMO MAESTRO DE DECISIÓN CLÍNICA: REGLA DE LOS 120 MINUTOS</text><text fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="232.3047" x="416.0806" y="45.5791">MINSAL GES N° 14 &bull; EUNACOM 2026</text></g><ellipse cx="418.9874" cy="73.9375" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F0F9FF" height="45.6094" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="242.6157" x="297.6796" y="103.9375"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="6.6011" x="307.6796" y="124.1479">🚨</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="212.1851" x="318.1102" y="124.1479">PACIENTE CON DOLOR ISQUÉMICO</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="181.6987" x="307.6796" y="136.9526">(Ingreso a Urgencias / SAMU)</text><rect fill="#F0F9FF" height="45.6094" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="234.5806" x="301.6971" y="169.5469"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="6.6011" x="311.6971" y="189.7573">🛡️</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="184.5884" x="322.1278" y="189.7573">Toma de ECG 12 Derivaciones</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="214.5806" x="311.6971" y="202.562">Meta: ≤ 10 minutos (Interpretado)</text><rect fill="#F0F9FF" height="45.6094" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="327.667" x="255.1539" y="235.1563"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="6.6011" x="265.1539" y="255.3667">💊</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="160.5205" x="275.5846" y="255.3667">Confirmación de SCACEST</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="307.667" x="265.1539" y="268.1714">Carga Inmediata DAPT (AAS + P2Y12) + Heparina</text><polygon fill="#FFFDF5" points="301.3739,300.7656,536.601,300.7656,548.601,312.7656,536.601,324.7656,301.3739,324.7656,289.3739,312.7656,301.3739,300.7656" style="stroke:#D97706;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#92400E" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="235.2271" x="301.3739" y="316.5737">¿Tiempo de Traslado a Hemodinamia?</text><text fill="#2563EB" font-family="Inter, sans-serif" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="88.9014" x="193.5096" y="310.4072">≤ 120 MINUTOS</text><text fill="#2563EB" font-family="Inter, sans-serif" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="88.9014" x="555.5638" y="310.4072">&gt; 120 MINUTOS</text><rect fill="#F0F9FF" height="84.0234" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="281.7549" x="16" y="334.7656"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="6.6011" x="26" y="354.9761">🟢</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="190.9102" x="36.4307" y="354.9761">ANGIOPLASTÍA PRIMARIA (PCI)</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="261.7549" x="26" y="367.7808">• Traslado urgente en SAMU medicalizado</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="217.438" x="26" y="380.5854">• Meta Puerta-Balón: &lt; 90 minutos</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="192.457" x="26" y="393.3901">• P2Y12: Ticagrelor 180 mg VO</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="256.7061" x="26" y="406.1948">• Anticoagulación: HNF o Enoxaparina EV</text><rect fill="#F0F9FF" height="32.8047" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="264.3364" x="24.7092" y="451.5938"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="244.3364" x="34.7092" y="471.8042">Ingreso directo a Sala de Hemodinamia</text><ellipse cx="156.8774" cy="530.3984" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="156.8774" cy="530.3984" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F0F9FF" height="96.8281" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="322.5" x="519.8474" y="334.7656"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="6.6011" x="529.8474" y="354.9761">🔴</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="152.5605" x="540.2781" y="354.9761">FIBRINOLISIS SISTÉMICA</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="286.2954" x="529.8474" y="367.7808">• Administrar en Hospital Comunitario / SAMU</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="217.8838" x="529.8474" y="380.5854">• Meta Puerta-Aguja: &lt; 30 minutos</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="302.5" x="529.8474" y="393.3901">• Fármaco: Tenecteplase (TNK) bolo EV por peso</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="281.3218" x="529.8474" y="406.1948">• P2Y12: Clopidogrel 300 mg (75 mg si &gt;75a)</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="248.4346" x="529.8474" y="418.9995">• Anticoagulación: Enoxaparina EV + SC</text><polygon fill="#FFFDF5" points="580.2095,464.3984,781.9854,464.3984,793.9854,477.2031,781.9854,490.0078,580.2095,490.0078,568.2095,477.2031,580.2095,464.3984" style="stroke:#D97706;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#92400E" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="201.7759" x="580.2095" y="474.6089">Evaluación ECG a los 60 - 90 min</text><text fill="#92400E" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="164.0547" x="580.2095" y="487.4136">¿Criterios de Reperfusión?</text><text fill="#2563EB" font-family="Inter, sans-serif" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="138.9307" x="422.3159" y="474.8447">✓ ÉXITO (ST baja &gt; 50%)</text><text fill="#2563EB" font-family="Inter, sans-serif" font-size="10" font-weight="700" lengthAdjust="spacing" textLength="183.4401" x="800.9482" y="474.8447">❌ FRACASO (ST persiste o dolor)</text><rect fill="#F0F9FF" height="45.6094" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="337.3296" x="327.7549" y="500.0078"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="263.291" x="337.7549" y="520.2183">Traslado para Coronariografía Sistemática</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="317.3296" x="337.7549" y="533.0229">Ventana terapéutica: 2 a 24 horas post-trombolisis</text><ellipse cx="496.4197" cy="576.6172" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="496.4197" cy="576.6172" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F0F9FF" height="45.6094" rx="4" ry="4" style="stroke:#0284C7;stroke-width:1.5;" width="361.3813" x="685.0845" y="500.0078"/><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="6.6011" x="695.0845" y="520.2183">🚨</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="244.9648" x="705.5151" y="520.2183">ANGIOPLASTÍA DE RESCATE INMEDIATA</text><text fill="#0369A1" font-family="Inter, sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="341.3813" x="695.0845" y="533.0229">Activación prioritaria de traslado de emergencia SAMU</text><ellipse cx="865.7751" cy="576.6172" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="865.7751" cy="576.6172" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#64748B;stroke-width:1.5;" x1="418.9874" x2="418.9874" y1="83.9375" y2="103.9375"/><polygon fill="#64748B" points="414.9874,93.9375,418.9874,103.9375,422.9874,93.9375,418.9874,97.9375" style="strok